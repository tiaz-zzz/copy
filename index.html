<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

    <title>Pfarrkirche Kefermarkt by Schindelar3D</title>

    <meta name="description" content="A nave of a historic church interior with wooden pews leading to an elevated sanctuary featuring a large gilded altarpiece. Carved pulpits and large religious paintings and sculptures flank the altar area."/>
    <meta name="author" content="Schindelar3D"/>
    <meta name="title" content="Pfarrkirche Kefermarkt by Schindelar3D"/>

    <meta property="og:site_name" content="Arrival.Space"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Pfarrkirche Kefermarkt by Schindelar3D"/>
    <meta property="og:description" content="A nave of a historic church interior with wooden pews leading to an elevated sanctuary featuring a large gilded altarpiece. Carved pulpits and large religious paintings and sculptures flank the altar area."/>
    <meta property="og:url" content="https://arrival.space/64122763_2334"/>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ======== 3D 场景画布 ======== -->
    <div id="scene-container"></div>

    <!-- ======== 启动 splash：灰底 + 伏羲科技标志（最先绘制） ======== -->
    <div id="splash" aria-hidden="true">
        <div class="splash-brand">
            <img class="splash-logo" src="assets/fuxi_logo.png" alt="伏羲科技" draggable="false">
            <div class="splash-wordmark">伏羲科技</div>
        </div>
    </div>

    <!-- ======== 进入前介绍层：实时模糊场景 + 标题 + 作者 ======== -->
    <div id="intro-overlay">
        <div class="intro-shade"></div>

        <h1 id="intro-title">online-museum</h1>

        <div id="intro-creator">
            <img class="avatar" src="assets/avatar.png" alt="fuxi3D" draggable="false">
            <span class="name">fuxi3D</span>
            <svg class="verified" viewBox="0 0 24 24" aria-label="认证创作者"><path d="M12 1.6l2.36 2.02 3.1-.36 1.18 2.9 2.9 1.18-.36 3.1L23.2 12.7l-2.02 2.36.36 3.1-2.9 1.18-1.18 2.9-3.1-.36L12 23.9l-2.36-2.02-3.1.36-1.18-2.9-2.9-1.18.36-3.1L.8 12.7l2.02-2.36-.36-3.1 2.9-1.18 1.18-2.9 3.1.36L12 1.6z" fill="url(#vgrad)"/><path d="M10.7 15.9l-3-3 1.3-1.3 1.7 1.7 4.3-4.3 1.3 1.3-5.6 5.6z" fill="#fff"/><defs><linearGradient id="vgrad" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#3E8BFF"/><stop offset="1" stop-color="#9858F6"/></linearGradient></defs></svg>
        </div>

        <div id="intro-progress"><div id="intro-progress-bar"></div></div>

        <button id="intro-enter" aria-label="进入空间">
            <img src="assets/fuxi_logo.png" alt="" draggable="false">
        </button>
    </div>

    <!-- ======== 场景内 UI 层 ======== -->
    <div id="hud">

        <!-- 左上：作者信息卡 -->
        <div id="creator-chip">
            <img class="avatar" src="assets/avatar.png" alt="Schindelar3D" draggable="false">
            <div class="chip-text">
                <div class="chip-row">
                    <span class="name">fuxi3D</span>
                    <svg class="verified" viewBox="0 0 24 24"><path d="M12 1.6l2.36 2.02 3.1-.36 1.18 2.9 2.9 1.18-.36 3.1L23.2 12.7l-2.02 2.36.36 3.1-2.9 1.18-1.18 2.9-3.1-.36L12 23.9l-2.36-2.02-3.1.36-1.18-2.9-2.9-1.18.36-3.1L.8 12.7l2.02-2.36-.36-3.1 2.9-1.18 1.18-2.9 3.1.36L12 1.6z" fill="url(#vgrad2)"/><path d="M10.7 15.9l-3-3 1.3-1.3 1.7 1.7 4.3-4.3 1.3 1.3-5.6 5.6z" fill="#fff"/><defs><linearGradient id="vgrad2" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#3E8BFF"/><stop offset="1" stop-color="#9858F6"/></linearGradient></defs></svg>
                    <span class="date">7月10日</span>
                </div>
                <div class="chip-title">online-museum</div>
            </div>
        </div>

        <!-- 右上：菜单 / 搜索 / 声音 -->
        <div id="top-actions">
            <button class="icon-btn" id="btn-menu" aria-label="菜单">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-search" aria-label="搜索">
                <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.3 15.3L20.5 20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn dim" id="btn-audio" aria-label="环境音（此空间无音频）">
                <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>

        <!-- 右侧：点赞 / 评论 / 收藏 / 分享 -->
        <div id="side-rail">
            <button class="rail-btn" id="btn-like" aria-label="点赞">
                <svg class="ic" viewBox="0 0 24 24"><path class="heart" d="M12 20.8C7.2 17.3 3.2 14 3.2 9.9 3.2 7 5.4 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.6 0 4.8 2 4.8 4.9 0 4.1-4 7.4-8.8 10.9z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
                <span class="count" id="like-count">49</span>
            </button>
            <button class="rail-btn" id="btn-comment" aria-label="评论">
                <span class="badge" id="comment-badge">13</span>
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 4.2c-4.6 0-8.3 3-8.3 6.9 0 1.9.9 3.6 2.4 4.9l-.7 3.6 3.9-1.9c.9.2 1.8.4 2.7.4 4.6 0 8.3-3.1 8.3-7s-3.7-6.9-8.3-6.9z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
                <span class="count" id="comment-count">13</span>
            </button>
            <button class="rail-btn" id="btn-save" aria-label="收藏">
                <svg class="ic" viewBox="0 0 24 24"><path class="bk" d="M6.5 4.5h11a.9.9 0 01.9.9V20l-6.4-3.6L5.6 20V5.4a.9.9 0 01.9-.9z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
                <span class="count" id="save-count">32</span>
            </button>
            <button class="rail-btn" id="btn-share" aria-label="分享">
                <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.5" cy="5.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.5" cy="18.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.4 10.8l6.8-4M8.4 13.2l6.8 4" stroke="currentColor" stroke-width="1.9"/></svg>
            </button>
        </div>

        <!-- 右下：青色 + 按钮 -->
        <button id="fab-plus" aria-label="认领您的空间">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>

        <!-- 左下：操作提示卡 -->
        <div id="hint-card">
            <button class="hint-q" id="btn-help" aria-label="帮助">?</button>
            <button class="hint-x" id="btn-hint-close" aria-label="关闭提示">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="hint-block keys">
                <div class="keyrow"><span class="key">W</span></div>
                <div class="keyrow"><span class="key">A</span><span class="key">S</span><span class="key">D</span></div>
                <div class="hint-label">移动</div>
            </div>
            <div class="hint-block mouse">
                <svg viewBox="0 0 34 46"><rect x="2" y="2" width="30" height="42" rx="15" fill="rgba(255,255,255,0.04)" stroke="#fff" stroke-width="2.2"/><path d="M2 17.5c0-8 6.5-15.5 15-15.5s15 7.5 15 15.5" fill="none" stroke="none"/><rect x="14.5" y="9" width="5" height="10" rx="2.5" fill="#35D0C5"/></svg>
                <div class="hint-label">环顾四周</div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast"></div>
    </div>

    <!-- ======== 右侧抽屉菜单 ======== -->
    <div id="drawer">
        <button id="drawer-collapse" aria-label="收起菜单">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="drawer-head">认领您的空间</div>
        <nav class="drawer-items">
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.3 15.3L20.5 20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>探索</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H10l-4.5 3.5v-3.5H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>私信</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg><span>录制屏幕</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="currentColor"/><path d="M18.5 15l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" fill="currentColor"/></svg><span>Vibes</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>虚拟形象</span></button>
            <div class="drawer-spacer"></div>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>登录</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><path d="M3.5 6h9M8 3.8V6M10.5 6c-1 4-3.6 7-7 9M6.5 10.5c1.3 2.6 3.7 4.4 6.5 5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M13 20l4-9.5L21 20M14.3 17h5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>语言</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.4a2.5 2.5 0 114.2 1.8c-.9.8-1.8 1.2-1.8 2.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.15" fill="currentColor"/></svg><span>帮助 &amp; 法律信息</span></button>
            <button class="drawer-item" data-demo><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8l1.2 2.7 2.9-.7 .7 2.9 2.7 1.2-1.4 2.6 1.4 2.6-2.7 1.2-.7 2.9-2.9-.7L12 21.2l-1.2-2.7-2.9.7-.7-2.9-2.7-1.2 1.4-2.6-1.4-2.6 2.7-1.2.7-2.9 2.9.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>设置</span></button>
        </nav>
    </div>

    <!-- ======== 搜索 / 探索浮层 ======== -->
    <div id="search-overlay">
        <div class="search-panel">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="#9a9a9a" stroke-width="2"/><path d="M15.3 15.3L20.5 20.5" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/></svg>
                <input id="search-input" type="text" placeholder="在 Arrival.Space 上搜索" autocomplete="off">
                <button id="search-close" aria-label="关闭搜索">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="search-hint">探索空间</div>
            <div class="search-card" data-goto="reload">
                <img src="assets/scene_seo.jpeg" alt="" draggable="false">
                <div class="search-card-text">
                    <div class="t1">online-museum</div>
                    <div class="t2">fuxi3D · 7月10日</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== 帮助弹层 ======== -->
    <div id="help-overlay">
        <div class="help-panel">
            <div class="help-head">操作说明 <button id="help-close" aria-label="关闭">✕</button></div>
            <div class="help-row"><b>第一视角</b><span>点击画面锁定鼠标</span></div>
            <div class="help-row"><b>环顾四周</b><span>锁定后直接移动鼠标</span></div>
            <div class="help-row"><b>移动</b><span>W A S D 或方向键</span></div>
            <div class="help-row"><b>跳跃</b><span>空格键</span></div>
            <div class="help-row"><b>快速移动</b><span>按住 Shift</span></div>
            <div class="help-row"><b>退出锁定</b><span>ESC（退出后可点界面按钮）</span></div>
        </div>
    </div>

    <script defer src="dist/bundle.js"></script>
</body>
</html>
